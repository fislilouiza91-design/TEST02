<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Smart Shopper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">S</div>
    <div class="popup-titles">
      <div class="popup-title">Smart Shopper</div>
      <div class="popup-sub">v1.0.0</div>
    </div>
  </div>
  <div class="popup-body">
    <div class="popup-status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Vérification...</span>
    </div>
    <div class="popup-info">
      <p>Ouvrez une page produit AliExpress pour voir les meilleurs prix.</p>
    </div>
    <div class="popup-actions">
      <button id="btn-open-aliexpress" class="popup-btn">🛒 Ouvrir AliExpress</button>
    </div>
  </div>
  <div class="popup-footer">
    <span>Fait avec ❤️ pour économiser</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
