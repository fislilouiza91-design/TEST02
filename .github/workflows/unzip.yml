name: Unzip Any Archive

on:
  push:
  workflow_dispatch: # يسمح لك بتشغيله يدوياً في أي وقت

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ضروري جداً لكي يستطيع رفع الملفات

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip all zip files
        run: |
          # البحث عن أي ملف ينتهي بـ zip وفك ضغطه في نفس المكان
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "جاري فك ضغط الملف: $file"
              unzip -o "$file"
            fi
          done

      - name: Commit extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-extract zip files to root" || echo "No changes to commit"
          git push
