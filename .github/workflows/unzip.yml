name: Unzip Archive

on:
  push:
    paths:
      - '*.zip' # يعمل عند رفع أي ملف zip
  workflow_dispatch: # هذا السطر يسمح لك بتشغيله يدوياً بزر

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ضروري لرفع الملفات المفكوكة

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip files
        run: unzip -o TEST01-main.zip -d extracted_folder/

      - name: Commit extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add extracted_folder/
          git commit -m "Extract TEST01-main.zip" || echo "No changes to commit"
          git push
